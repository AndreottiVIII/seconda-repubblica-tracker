name: Aggiorna e pubblica

# Ogni notte alle 4 UTC. GitHub fa partire i lavori programmati quando le sue
# macchine sono libere, quindi l'orario e' un'indicazione, non un appuntamento.
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pagine
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pubblicazione.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scarica i dati dalle tre fonti
        run: python scripts/scarica_elenco.py --fresco

      - name: Ricostruisci la mappa dei partiti
        run: python scripts/costruisci_mappa_partiti.py

      - name: Genera il sito
        run: python scripts/genera_sito.py

      # Due passi distinti, e la differenza conta. Il primo e' un controllo
      # e deve fermare tutto: se i morti tornano vivi in massa vuol dire che
      # una fonte e' caduta, e pubblicare peggiorerebbe il sito invece di
      # aggiornarlo. Il secondo e' contabilita': tenere il registro dei
      # decessi nella cronologia del repository e' utile, ma se fallisce non
      # e' una ragione per non pubblicare.
      - name: Controlla che nessuno torni in vita
        run: python scripts/novita.py > novita.txt

      - name: Registra le novita'
        continue-on-error: true
        run: |
          MESSAGGIO="$(cat novita.txt)"
          rm -f novita.txt
          if [ -z "$MESSAGGIO" ]; then
            echo "Nessuna novita': sono ancora tutti al loro posto."
            exit 0
          fi
          echo "Novita': $MESSAGGIO"
          git config user.name  "Seconda Repubblica Tracker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/elenco.json data/registri sito/index.html
          if git diff --cached --quiet; then
            echo "Le novita' non hanno cambiato nessun file da versionare."
            exit 0
          fi
          git commit -m "$(date -u +%Y-%m-%d): $MESSAGGIO"
          git push || echo "ATTENZIONE: commit fatto ma non spinto. Si pubblica lo stesso."

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: sito

      - id: pubblicazione
        uses: actions/deploy-pages@v4
