<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>%%TITOLO%%</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2016%2016%22%20shape-rendering%3D%22crispEdges%22%3E%3Crect%20width%3D%2216%22%20height%3D%2216%22%20fill%3D%22%23000000%22/%3E%3Crect%20x%3D%221%22%20y%3D%221%22%20width%3D%2214%22%20height%3D%2214%22%20fill%3D%22%23c0c0c0%22/%3E%3Crect%20x%3D%221%22%20y%3D%221%22%20width%3D%2214%22%20height%3D%224%22%20fill%3D%22%23000080%22/%3E%3Crect%20x%3D%2211%22%20y%3D%222%22%20width%3D%223%22%20height%3D%222%22%20fill%3D%22%23c0c0c0%22/%3E%3Crect%20x%3D%222%22%20y%3D%226%22%20width%3D%2212%22%20height%3D%222%22%20fill%3D%22%23e2001a%22/%3E%3Crect%20x%3D%222%22%20y%3D%229%22%20width%3D%229%22%20height%3D%222%22%20fill%3D%22%23005baa%22/%3E%3Crect%20x%3D%222%22%20y%3D%2212%22%20width%3D%226%22%20height%3D%222%22%20fill%3D%22%23009933%22/%3E%3Crect%20x%3D%229%22%20y%3D%2212%22%20width%3D%225%22%20height%3D%222%22%20fill%3D%22%23ff7900%22/%3E%3C/svg%3E">
<style>
/* ---------------------------------------------------------------------------
   Windows 95. Tre colori e due bordi: il rilievo si fa col chiaro in alto a
   sinistra e lo scuro in basso a destra, l'incavo al contrario. Non serve
   nient'altro, ed e' il motivo per cui quell'interfaccia si disegnava con
   quattro pixel.
   --------------------------------------------------------------------------- */
:root{
  --faccia:#c0c0c0; --luce:#ffffff; --chiaro:#dfdfdf; --ombra:#808080;
  --buio:#000000; --scrivania:#008080; --titolo:#000080; --titolo-spento:#808080;
  --selezione:#000080; --testo:#000000; --campo:#ffffff;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;padding:0}
body{
  background:var(--scrivania); color:var(--testo); overflow:hidden;
  font-family:"MS Sans Serif",Tahoma,Geneva,Verdana,sans-serif; font-size:12px;
  -webkit-font-smoothing:none;
}
body.attesa,body.attesa *{cursor:wait !important}

.rilievo{border:2px solid;border-color:var(--luce) var(--buio) var(--buio) var(--luce);
  box-shadow:inset 1px 1px 0 var(--chiaro),inset -1px -1px 0 var(--ombra);
  background:var(--faccia)}
.incavo{border:2px solid;border-color:var(--ombra) var(--luce) var(--luce) var(--ombra);
  box-shadow:inset 1px 1px 0 var(--buio),inset -1px -1px 0 var(--chiaro);
  background:var(--campo)}
.incavo-piatto{border:2px solid;border-color:var(--ombra) var(--luce) var(--luce) var(--ombra);
  background:var(--faccia)}

/* --- scrivania e icone --- */
#scrivania{position:absolute;inset:0 0 30px 0;overflow:hidden}
/* Una colonna sola non basta piu': quando le icone superano l'altezza dello
   schermo devono andare a capo in una seconda colonna, come su una scrivania
   vera, invece di finire sotto la barra delle applicazioni. Il wrap in
   direzione colonna fa esattamente questo, e non serve calcolare niente. */
#icone,#icone-destra{position:absolute;top:8px;z-index:1;display:flex;
  flex-flow:column wrap;max-height:calc(100% - 92px);gap:4px 8px}
#icone{left:8px;align-content:flex-start}
#icone-destra{right:8px;align-content:flex-end}
/* Il cestino sta in fondo a destra, come su ogni scrivania. */
#cestino-icona{position:absolute;right:8px;bottom:8px;z-index:1}
.icona{width:88px;padding:4px 2px;text-align:center;cursor:default;
  color:#fff;text-shadow:1px 1px 0 rgba(0,0,0,.7);user-select:none}
.icona .dis{font-size:30px;line-height:34px;display:block}
.icona .et{display:inline-block;padding:1px 3px;font-size:11px;line-height:13px}
.icona:hover .et{background:rgba(0,0,128,.45)}
.icona.viva .et{background:var(--selezione);color:#fff;outline:1px dotted #fff}

/* --- finestre --- */
.finestra{position:absolute;min-width:260px;display:flex;flex-direction:column;
  background:var(--faccia);
  border:2px solid;border-color:var(--luce) var(--buio) var(--buio) var(--luce);
  box-shadow:inset 1px 1px 0 var(--chiaro),inset -1px -1px 0 var(--ombra);
  padding:2px}
.barra-titolo{display:flex;align-items:center;gap:4px;padding:2px 2px 2px 3px;
  background:var(--titolo-spento);color:#fff;font-weight:bold;cursor:default;
  user-select:none;flex:none}
.finestra.fronte .barra-titolo{
  background:linear-gradient(90deg,var(--titolo),#1084d0)}
.barra-titolo .tit{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barra-titolo .dis{font-size:12px}
.bottoni{display:flex;gap:2px;flex:none}
.bottoni button{width:18px;height:16px;padding:0;font-size:10px;line-height:10px;
  font-family:inherit;font-weight:bold;background:var(--faccia);color:#000;
  border:2px solid;border-color:var(--luce) var(--buio) var(--buio) var(--luce);
  box-shadow:inset 1px 1px 0 var(--chiaro),inset -1px -1px 0 var(--ombra);
  cursor:default}
.bottoni button:active{border-color:var(--ombra) var(--luce) var(--luce) var(--ombra);
  box-shadow:inset 1px 1px 0 var(--buio)}
.menu-finestra{display:flex;gap:2px;padding:1px 2px;flex:none}
.menu-finestra span{padding:1px 6px;cursor:default}
.menu-finestra span:hover{background:var(--selezione);color:#fff}
.corpo{flex:1;overflow:auto;margin:2px;padding:8px;
  border:2px solid;border-color:var(--ombra) var(--luce) var(--luce) var(--ombra);
  box-shadow:inset 1px 1px 0 var(--buio),inset -1px -1px 0 var(--chiaro);
  background:var(--campo)}
.corpo.faccia{background:var(--faccia)}
.stato{display:flex;gap:2px;padding:0 2px 1px;flex:none}
.stato div{padding:2px 5px;font-size:11px;
  border:2px solid;border-color:var(--ombra) var(--luce) var(--luce) var(--ombra)}
.stato div:first-child{flex:1}
.maniglia{position:absolute;right:1px;bottom:1px;width:14px;height:14px;
  cursor:nwse-resize}

/* --- barra delle applicazioni --- */
#barra{position:absolute;left:0;right:0;bottom:0;height:30px;display:flex;
  align-items:center;gap:4px;padding:2px 3px;background:var(--faccia);
  border-top:2px solid var(--luce);z-index:9000}
#avvio{display:flex;align-items:center;gap:4px;height:23px;padding:0 6px;
  font-family:inherit;font-size:12px;font-weight:bold;background:var(--faccia);
  border:2px solid;border-color:var(--luce) var(--buio) var(--buio) var(--luce);
  box-shadow:inset 1px 1px 0 var(--chiaro),inset -1px -1px 0 var(--ombra);
  cursor:default}
#avvio.aperto{border-color:var(--ombra) var(--luce) var(--luce) var(--ombra);
  box-shadow:inset 1px 1px 0 var(--buio)}
#attivita{flex:1;display:flex;gap:3px;overflow:hidden}
.taskbtn{max-width:170px;min-width:0;flex:1 1 130px;height:22px;padding:0 6px;
  display:flex;align-items:center;gap:4px;font-family:inherit;font-size:11px;
  background:var(--faccia);cursor:default;overflow:hidden;white-space:nowrap;
  border:2px solid;border-color:var(--luce) var(--buio) var(--buio) var(--luce)}
.taskbtn.giu{border-color:var(--ombra) var(--luce) var(--luce) var(--ombra);
  background:repeating-conic-gradient(var(--faccia) 0 25%,var(--chiaro) 0 50%) 0 0/2px 2px;
  font-weight:bold}
.taskbtn .et{overflow:hidden;text-overflow:ellipsis}
#orologio{padding:3px 8px;font-size:11px;
  border:2px solid;border-color:var(--ombra) var(--luce) var(--luce) var(--ombra)}

/* --- menu avvio --- */
#menu{position:absolute;left:3px;bottom:30px;width:230px;display:none;
  background:var(--faccia);z-index:9500;padding:2px;
  border:2px solid;border-color:var(--luce) var(--buio) var(--buio) var(--luce);
  box-shadow:inset 1px 1px 0 var(--chiaro),inset -1px -1px 0 var(--ombra)}
#menu.aperto{display:flex}
#menu .costola{width:22px;flex:none;
  background:linear-gradient(180deg,#000080,#1084d0);position:relative}
#menu .costola span{position:absolute;bottom:8px;left:50%;
  transform:translateX(-50%) rotate(180deg);writing-mode:vertical-rl;
  color:#fff;font-size:15px;font-weight:bold;letter-spacing:1px;white-space:nowrap}
/* Venti voci non ci stanno su uno schermo basso: la lista scorre
   invece di sfondare sotto la barra. */
#menu ul{list-style:none;margin:0;padding:2px 0;flex:1;
  max-height:calc(100vh - 84px);overflow-y:auto}
#menu li{display:flex;align-items:center;gap:8px;padding:5px 8px;cursor:default}
#menu li:hover{background:var(--selezione);color:#fff}
#menu li.riga{padding:0;margin:3px 2px;height:2px;
  border-top:1px solid var(--ombra);border-bottom:1px solid var(--luce)}
#menu li.riga:hover{background:none}
#menu li .dis{font-size:18px;width:22px;text-align:center}

/* --- contenuti --- */
h1,h2,h3{margin:0 0 6px;font-size:13px}
h1{font-size:14px}
p{margin:0 0 8px;line-height:1.45}
a{color:#0000c0}
a:hover{color:#c00000}
.clic{color:#0000c0;text-decoration:underline;cursor:pointer}
.clic:hover{color:#c00000}
table{border-collapse:collapse;width:100%;font-size:12px}
th{position:sticky;top:-8px;background:var(--faccia);text-align:left;
  padding:3px 6px;font-weight:bold;z-index:2;
  border:2px solid;border-color:var(--luce) var(--ombra) var(--ombra) var(--luce);
  cursor:default;white-space:nowrap}
td{padding:2px 6px;border-bottom:1px solid #e6e6e6;vertical-align:top}
tr.riga:hover td{background:#e8e8f8}
tr.riga{cursor:default}
.num{text-align:right;font-variant-numeric:tabular-nums}
.morto{color:#606060}
.pill{display:inline-block;padding:0 5px;margin:1px 2px 1px 0;color:#fff;
  font-size:11px;line-height:16px;white-space:nowrap;
  border:1px solid rgba(0,0,0,.35)}
.pill.chiara{color:#000}
.quadro{width:10px;height:10px;display:inline-block;vertical-align:-1px;
  margin-right:4px;border:1px solid rgba(0,0,0,.4)}
.gruppone{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:6px}
.riquadro{padding:8px;background:var(--faccia);
  border:2px solid;border-color:var(--luce) var(--ombra) var(--ombra) var(--luce)}
.riquadro .grande{font-size:22px;font-weight:bold;line-height:26px}
.cartella{display:inline-flex;flex-direction:column;align-items:center;
  width:104px;padding:6px 2px;text-align:center;cursor:default}
.cartella:hover{background:#e8e8f8}
.cartella .dis{font-size:28px;line-height:30px}
.piede{margin-top:10px;padding-top:6px;border-top:1px solid var(--ombra);
  font-size:11px;color:#404040}
.avviso{padding:6px 8px;margin:0 0 8px;background:#ffffe1;
  border:1px solid var(--buio);font-size:11px}
input[type=text],select{font-family:inherit;font-size:12px;padding:2px 4px;
  background:var(--campo);
  border:2px solid;border-color:var(--ombra) var(--luce) var(--luce) var(--ombra);
  box-shadow:inset 1px 1px 0 var(--buio)}
button.p95{font-family:inherit;font-size:12px;padding:3px 12px;min-width:70px;
  background:var(--faccia);cursor:default;
  border:2px solid;border-color:var(--luce) var(--buio) var(--buio) var(--luce);
  box-shadow:inset 1px 1px 0 var(--chiaro),inset -1px -1px 0 var(--ombra)}
button.p95:active{border-color:var(--ombra) var(--luce) var(--luce) var(--ombra);
  box-shadow:inset 1px 1px 0 var(--buio)}

/* --- la striscia del tempo di una persona --- */
.striscia{position:relative;height:26px;margin:6px 0 2px;background:#e0e0e0;
  border:2px solid;border-color:var(--ombra) var(--luce) var(--luce) var(--ombra)}
.striscia i{position:absolute;top:0;bottom:0;overflow:hidden;font-style:normal;
  font-size:10px;line-height:22px;color:#fff;text-align:center;
  text-shadow:0 0 2px rgba(0,0,0,.8);border-right:1px solid rgba(0,0,0,.35)}
.tacche{position:relative;height:14px;font-size:10px;color:#404040}
.tacche span{position:absolute;transform:translateX(-50%);white-space:nowrap}

/* --- scheda persona --- */
.scheda{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.ritratto{width:120px;flex:none;background:var(--faccia);padding:3px;
  border:2px solid;border-color:var(--ombra) var(--luce) var(--luce) var(--ombra)}
.ritratto img{width:100%;display:block;image-rendering:auto}
.ritratto .vuoto{height:150px;display:flex;align-items:center;justify-content:center;
  font-size:44px;color:var(--ombra);background:#e8e8e8}
.dati{flex:1;min-width:220px}
.dati dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0}
.dati dt{font-weight:bold;white-space:nowrap}
.dati dd{margin:0}

/* --- salvaschermo e schermata blu --- */
#salvaschermo{position:fixed;inset:0;background:#000;z-index:9800;display:none}
#salvaschermo.acceso{display:block}
#salvaschermo b{position:absolute;color:#00ff66;font-size:26px;white-space:nowrap;
  font-weight:bold;text-shadow:0 0 12px #00ff66}
#bsod{position:fixed;inset:0;background:#0000aa;color:#fff;z-index:9900;
  display:none;padding:8vh 8vw;font-family:"Courier New",monospace;font-size:15px;
  line-height:1.6}
#bsod.acceso{display:block}
#bsod .cap{background:#c0c0c0;color:#0000aa;padding:0 8px;font-weight:bold}

@media (max-width:768px){
  body{font-size:14px}
  #icone,#icone-destra,#cestino-icona{position:static;max-height:none;
    flex-flow:row wrap;align-content:flex-start;gap:2px;padding:6px}
  .icona{width:78px}
  .finestra{position:static !important;width:auto !important;
    height:auto !important;margin:6px;max-height:none}
  .corpo{max-height:none;padding:8px 6px}
  #scrivania{overflow:auto;-webkit-overflow-scrolling:touch}
  .maniglia{display:none}
  .bottoni button:not(.chiudi){display:none}
  th{position:static}
}
</style>

<body>

<div id="scrivania">
  <div id="icone"></div>
  <div id="icone-destra"></div>
  <div id="cestino-icona"></div>
  <div id="finestre"></div>
</div>

<div id="barra">
  <button id="avvio"><span>&#9612;&#9612;</span> Avvio</button>
  <div id="attivita"></div>
  <div id="orologio"></div>
</div>

<div id="menu">
  <div class="costola"><span>Seconda Repubblica 95</span></div>
  <ul id="voci-menu"></ul>
</div>

<div id="salvaschermo"><b>Seconda Repubblica Tracker</b></div>

<div id="bsod">
  <p><span class="cap">Seconda Repubblica</span></p>
  <p id="bsod-testo">Si &egrave; verificato un errore irreversibile.</p>
  <p>&nbsp;</p>
  <p>* Premere un tasto qualsiasi per tornare alla scrivania.</p>
  <p>&nbsp;</p>
  <p style="text-align:center">Premere un tasto per continuare _</p>
</div>

<script>
/* L'indirizzo del sito non cambia mai, e GitHub lo serve con dieci minuti di
   cache: chi ha aperto la pagina poco prima di una correzione continua a
   vedere quella vecchia, e il browser non chiede nemmeno se ce ne sia una
   nuova. Quindi la pagina se lo chiede da sola, scavalcando la cache, e se
   trova una versione piu' fresca si ricarica una volta sola.

   Una volta sola per davvero: il numero di versione atteso resta annotato,
   cosi' se la copia che torna e' ancora quella vecchia non si riparte in
   circolo. E con un tempo massimo, perche' fetch da solo non ce l'ha e
   aspetterebbe per sempre. */
const VERSIONE = '%%VERSIONE%%';
(function controllaVersione(){
  if (location.protocol === 'file:' || !window.fetch) return;
  const taglia = new AbortController();
  const scadenza = setTimeout(() => taglia.abort(), 6000);
  fetch('versione.txt?_=' + Date.now(), {cache: 'no-store', signal: taglia.signal})
    .then(r => r.ok ? r.text() : null)
    .then(t => {
      clearTimeout(scadenza);
      const fresca = (t || '').trim();
      if (!fresca || fresca === VERSIONE) return;
      try {
        if (sessionStorage.getItem('attesa') === fresca) return;
        sessionStorage.setItem('attesa', fresca);
      } catch (e) { return; }
      // Un indirizzo diverso e' l'unico modo sicuro di scavalcare la cache.
      location.replace(location.pathname + '?v=' + encodeURIComponent(fresca) +
                       location.hash);
    })
    .catch(() => clearTimeout(scadenza));
})();

const DATI = /*__DATI__*/;
const COLOFONE = /*__COLOFONE__*/;

const P = DATI.persone;
const PARTITI = DATI.partiti;
const LEG = DATI.legislature;
const ORDINE = LEG.map(l => l.n);
const perQid = {}; P.forEach(p => perQid[p.q] = p);
/* Un elenco di persone si ordina per cognome. I registri lo tengono separato
   dal nome, quindi non c'e' da indovinare dove finisce l'uno. */
const perCognome = (a, b) =>
  (a.co || '').localeCompare(b.co || '', 'it') ||
  (a.n || '').localeCompare(b.n || '', 'it');
P.sort(perCognome);

/* ---------- utilita' ---------- */
const migliaia = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const conUnDecimale = n => (Math.round(n * 10) / 10).toFixed(1).replace('.', ',');
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const perc = (n, t) => t ? String(Math.round(1000 * n / t) / 10).replace('.', ',') : 0;
const nomePartito = c => (PARTITI[c] && PARTITI[c].nome) || c || 'senza gruppo';
const colorePartito = c => (PARTITI[c] && PARTITI[c].colore) || '#909090';

function chiaroSuScuro(hex){
  const n = parseInt((hex || '#888').slice(1), 16);
  const l = (((n>>16)&255)*299 + ((n>>8)&255)*587 + (n&255)*114) / 1000;
  return l > 160;
}
function pill(codice, testo){
  const c = colorePartito(codice);
  return '<span class="pill' + (chiaroSuScuro(c) ? ' chiara' : '') +
    '" style="background:' + c + '">' + esc(testo || codice) + '</span>';
}
const MESI = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio',
  'agosto','settembre','ottobre','novembre','dicembre'];
function dataIt(s){
  if (!s) return '';
  if (s.length === 8) s = s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8);
  const p = s.split('-');
  if (p.length === 1) return p[0];
  if (p.length === 2) return MESI[+p[1]-1] + ' ' + p[0];
  return (+p[2]) + ' ' + MESI[+p[1]-1] + ' ' + p[0];
}
function giorno(s){                       // 'YYYYMMDD' -> numero di giorni
  if (!s || s.length < 8) return null;
  return Date.UTC(+s.slice(0,4), +s.slice(4,6)-1, +s.slice(6,8)) / 86400000;
}
const OGGI = new Date();
function eta(p){
  if (!p.b) return null;
  const fine = p.d ? new Date(p.d.length >= 10 ? p.d : p.d.slice(0,4)+'-07-01') : OGGI;
  const nas = new Date(p.b.length >= 10 ? p.b : p.b.slice(0,4)+'-07-01');
  let a = fine.getFullYear() - nas.getFullYear();
  const m = fine.getMonth() - nas.getMonth();
  if (m < 0 || (m === 0 && fine.getDate() < nas.getDate())) a--;
  return a;
}

/* ---------- interrogazioni sull'elenco ---------- */
const vivi     = () => P.filter(p => p.s === 1);
const morti    = () => P.filter(p => p.s === 2);
const ignoti   = () => P.filter(p => p.s === 3);
const conGruppo= () => P.filter(p => p.g);
const legislatureDi = p => p.m;
const partitiDi = p => {
  const v = [];
  (p.g || []).forEach(t => { if (v.indexOf(t[1]) < 0) v.push(t[1]); });
  return v;
};
function passaggiDi(p){                 // il percorso ridotto ai salti visibili
  const v = [];
  (p.g || []).forEach(t => { if (!v.length || v[v.length-1] !== t[1]) v.push(t[1]); });
  return v;
}
function membriDi(codice){
  return P.filter(p => (p.g || []).some(t => t[1] === codice));
}
function annidiPartito(codice){
  let da = null, a = null;
  P.forEach(p => (p.g || []).forEach(t => {
    if (t[1] !== codice) return;
    if (t[2] && (!da || t[2] < da)) da = t[2];
    if (t[3] && (!a || t[3] > a)) a = t[3];
  }));
  return [da, a];
}

/* ---------- il gestore delle finestre ---------- */
const FIN = {};          // chiave -> {el, vista, arg}
let zeta = 10, apertaN = 0;
const stretto = () => window.innerWidth <= 768;

function chiave(vista, arg){ return arg ? vista + '/' + arg : vista; }

function apri(vista, arg, senzaStoria){
  const k = chiave(vista, arg);
  if (FIN[k]) { fronte(k); if (!senzaStoria) storia(k); return; }
  const v = VISTE[vista];
  if (!v) return schermataBlu('La vista richiesta non esiste: ' + vista);
  document.body.classList.add('attesa');
  let contenuto;
  try { contenuto = v(arg); }
  catch (e) { document.body.classList.remove('attesa');
              return schermataBlu(e && e.message ? e.message : String(e)); }
  const el = document.createElement('div');
  el.className = 'finestra';
  const l = Math.min(contenuto.larghezza || 640, window.innerWidth - 30);
  const h = Math.min(contenuto.altezza || 460, window.innerHeight - 70);
  if (!stretto()){
    el.style.width = l + 'px';
    el.style.height = h + 'px';
    const passo = (apertaN++ % 7) * 24;
    el.style.left = Math.max(8, Math.min(118 + passo, window.innerWidth - l - 12)) + 'px';
    el.style.top  = Math.max(8, Math.min(20 + passo, window.innerHeight - h - 50)) + 'px';
  }
  el.innerHTML =
    '<div class="barra-titolo"><span class="dis">' + (contenuto.icona || '&#128462;') +
      '</span><span class="tit">' + esc(contenuto.titolo) + '</span>' +
      '<span class="bottoni">' +
        '<button class="riduci" title="Riduci a icona">_</button>' +
        '<button class="ingrandisci" title="Ingrandisci">&#9633;</button>' +
        '<button class="chiudi" title="Chiudi">&#10005;</button>' +
      '</span></div>' +
    '<div class="menu-finestra"><span data-menu="file">File</span>' +
      '<span data-menu="vai">Vai</span><span data-menu="?">?</span></div>' +
    '<div class="corpo' + (contenuto.faccia ? ' faccia' : '') + '">' + contenuto.html + '</div>' +
    '<div class="stato"><div>' + esc(contenuto.stato || '') + '</div>' +
      '<div>' + esc(contenuto.stato2 || '') + '</div></div>' +
    '<div class="maniglia"></div>';
  document.getElementById('finestre').appendChild(el);
  FIN[k] = {el: el, vista: vista, arg: arg, titolo: contenuto.titolo,
            icona: contenuto.icona || '&#128462;'};
  collega(k);
  fronte(k);
  disegnaBarra();
  if (!senzaStoria) storia(k);
  if (vista === 'confronta') disegnaConfronto();
  document.body.classList.remove('attesa');
  return FIN[k];
}

function chiudi(k){
  if (!FIN[k]) return;
  FIN[k].el.remove();
  delete FIN[k];
  disegnaBarra();
  const restanti = Object.keys(FIN);
  if (restanti.length) fronte(restanti[restanti.length - 1]);
}

function fronte(k){
  if (!FIN[k]) return;
  Object.keys(FIN).forEach(x => FIN[x].el.classList.remove('fronte'));
  FIN[k].el.style.display = '';
  FIN[k].el.style.zIndex = ++zeta;
  FIN[k].el.classList.add('fronte');
  disegnaBarra();
}

function collega(k){
  const f = FIN[k], el = f.el;
  const titolo = el.querySelector('.barra-titolo');
  el.addEventListener('mousedown', () => fronte(k), true);
  el.querySelector('.chiudi').onclick = e => { e.stopPropagation(); chiudi(k); };
  el.querySelector('.riduci').onclick = e => {
    e.stopPropagation(); el.style.display = 'none'; disegnaBarra(); };
  el.querySelector('.ingrandisci').onclick = e => {
    e.stopPropagation();
    if (el.dataset.grande){
      el.style.cssText = el.dataset.prima; delete el.dataset.grande;
    } else {
      el.dataset.prima = el.style.cssText; el.dataset.grande = '1';
      el.style.left = '0px'; el.style.top = '0px';
      el.style.width = window.innerWidth + 'px';
      el.style.height = (window.innerHeight - 30) + 'px';
    }
  };
  titolo.ondblclick = () => el.querySelector('.ingrandisci').click();
  el.querySelectorAll('.menu-finestra span').forEach(s => {
    s.onclick = () => {
      const q = s.dataset.menu;
      if (q === 'file') chiudi(k);
      else if (q === 'vai') apri('indice');
      else apri('leggimi');
    };
  });
  if (stretto()) return;
  trascina(titolo, el);
  ridimensiona(el.querySelector('.maniglia'), el);
}

function trascina(presa, el){
  presa.addEventListener('mousedown', e => {
    if (e.target.closest('.bottoni')) return;
    const x0 = e.clientX, y0 = e.clientY;
    const l0 = el.offsetLeft, t0 = el.offsetTop;
    const muovi = ev => {
      el.style.left = Math.max(-el.offsetWidth + 80,
        Math.min(window.innerWidth - 60, l0 + ev.clientX - x0)) + 'px';
      el.style.top = Math.max(0,
        Math.min(window.innerHeight - 60, t0 + ev.clientY - y0)) + 'px';
    };
    const molla = () => {
      document.removeEventListener('mousemove', muovi);
      document.removeEventListener('mouseup', molla);
    };
    document.addEventListener('mousemove', muovi);
    document.addEventListener('mouseup', molla);
    e.preventDefault();
  });
}

function ridimensiona(presa, el){
  presa.addEventListener('mousedown', e => {
    const x0 = e.clientX, y0 = e.clientY;
    const l0 = el.offsetWidth, a0 = el.offsetHeight;
    const muovi = ev => {
      el.style.width = Math.max(260, l0 + ev.clientX - x0) + 'px';
      el.style.height = Math.max(140, a0 + ev.clientY - y0) + 'px';
    };
    const molla = () => {
      document.removeEventListener('mousemove', muovi);
      document.removeEventListener('mouseup', molla);
    };
    document.addEventListener('mousemove', muovi);
    document.addEventListener('mouseup', molla);
    e.preventDefault(); e.stopPropagation();
  });
}

function disegnaBarra(){
  const b = document.getElementById('attivita');
  b.innerHTML = '';
  Object.keys(FIN).forEach(k => {
    const f = FIN[k];
    const t = document.createElement('button');
    t.className = 'taskbtn' + (f.el.classList.contains('fronte') &&
      f.el.style.display !== 'none' ? ' giu' : '');
    t.innerHTML = '<span class="dis">' + f.icona + '</span>' +
      '<span class="et">' + esc(f.titolo) + '</span>';
    t.onclick = () => {
      if (f.el.style.display === 'none') { fronte(k); }
      else if (f.el.classList.contains('fronte')) { f.el.style.display = 'none'; disegnaBarra(); }
      else fronte(k);
    };
    b.appendChild(t);
  });
}

/* ---------- la cronologia del browser ---------- */
let ignoraHash = false;
function storia(k){
  ignoraHash = true;
  location.hash = '#' + k;
  setTimeout(() => { ignoraHash = false; }, 0);
}
window.addEventListener('hashchange', () => {
  if (ignoraHash) return;
  const h = decodeURIComponent(location.hash.replace(/^#/, ''));
  if (!h) return;
  const i = h.indexOf('/');
  const vista = i < 0 ? h : h.slice(0, i);
  const arg = i < 0 ? '' : h.slice(i + 1);
  apri(vista, arg, true);
});

/* ---------- pezzi riusabili ---------- */
function perElenco(p){
  /* 'Andreotti Giulio': in un elenco ordinato per cognome, il cognome sta
     davanti, altrimenti l'ordine sembra casuale. Nella scheda resta il nome
     come lo si dice. */
  if (!p.co) return p.n;
  // Niente espressioni regolari costruite al volo su dati altrui: un cognome
  // con una parentesi o un punto le manderebbe in pezzi. Basta cercare la
  // posizione del cognome dentro il nome e togliercelo.
  const i = p.n.toLowerCase().lastIndexOf(p.co.toLowerCase());
  if (i < 0) return p.co + ' ' + p.n;
  const resto = (p.n.slice(0, i) + ' ' + p.n.slice(i + p.co.length))
                  .replace(/\s+/g, ' ').trim();
  return resto ? p.co + ' ' + resto : p.n;
}

function tabellaPersone(elenco, opzioni){
  opzioni = opzioni || {};
  if (!elenco.length) return '<p>Nessuno.</p>';
  const righe = elenco.map(p => {
    const passaggi = passaggiDi(p);
    return '<tr class="riga" data-q="' + p.q + '">' +
      '<td>' + (p.s === 2 ? '<span class="morto">' : '<span>') + esc(perElenco(p)) +
        (p.v ? ' &#9884;' : '') + (p.x ? ' &#9873;' : '') + (p.ds ? ' &#9733;' : '') + '</span></td>' +
      '<td class="num">' + (p.b ? p.b.slice(0,4) : '&mdash;') + '</td>' +
      '<td>' + p.m.join(' ') + '</td>' +
      '<td>' + passaggi.slice(0, 4).map(c => pill(c)).join('') +
        (passaggi.length > 4 ? '&hellip;' : '') + '</td>' +
      '<td class="num">' + p.c + '</td>' +
      '<td>' + (p.s === 1 ? 'vivo' : p.s === 2 ? '&#8224; ' + (p.d ? p.d.slice(0,4) : '') : '?') + '</td>' +
    '</tr>';
  }).join('');
  return '<table><thead><tr>' +
    '<th>Nome</th><th class="num">Nato</th><th>Legislature</th>' +
    '<th>Casacche</th><th class="num">Cambi</th><th>Stato</th>' +
    '</tr></thead><tbody>' + righe + '</tbody></table>';
}

function numero(n, vista, arg){
  return '<span class="clic" data-apri="' + vista + '" data-arg="' +
    esc(arg || '') + '">' + n + '</span>';
}

function riquadro(et, n, sotto, vista, arg){
  return '<div class="riquadro"><div>' + et + '</div>' +
    '<div class="grande">' + numero(n.toLocaleString('it-IT'), vista, arg) + '</div>' +
    '<div style="font-size:11px;color:#404040">' + sotto + '</div></div>';
}

function contaCambiIn(p, leg){
  const i = ORDINE.indexOf(leg);
  const passi = (p.g || []).filter(t => t[0] === i);
  let n = 0;
  for (let x = 1; x < passi.length; x++) if (passi[x][1] !== passi[x-1][1]) n++;
  return n;
}

const NUMERO_LEG = {XII: 12, XIII: 13, XIV: 14, XV: 15, XVI: 16};

function ritratto(p){
  if (p.f)
    // Il nome del file arriva gia' codificato da Wikidata: codificarlo una
    // seconda volta lo rompe, e 'Luigi%20Bobbio.jpg' diventa
    // 'Luigi%2520Bobbio.jpg', che non esiste.
    return '<img alt="" src="https://commons.wikimedia.org/wiki/Special:FilePath/' +
           p.f + '?width=240">';
  if (p.fc)
    return '<img alt="" src="https://documenti.camera.it/apps/nuovosito/deputato/' +
           'getFoto.asp?id=' + encodeURIComponent(p.fc[0]) + '&legislatura=' +
           NUMERO_LEG[p.fc[1]] + '">';
  if (p.fs)
    // Il Senato numera i file con otto cifre e gli zeri davanti.
    return '<img alt="" src="https://www.senato.it/leg/' + encodeURIComponent(p.fs[0]) +
           '/Immagini/Senatori/' + String(p.fs[1]).padStart(8, '0') + '.jpg">';
  return '<div class="vuoto">&#128100;</div>';
}

function striscia(p){
  const t0 = giorno(LEG[0].da), t1 = giorno(LEG[LEG.length-1].a);
  const arco = t1 - t0;
  let barre = '';
  (p.g || []).forEach(t => {
    const a = giorno(t[2]), b = giorno(t[3]);
    if (a == null || b == null) return;
    const x = Math.max(0, (a - t0) / arco) * 100;
    const l = Math.max(0.6, (Math.min(b, t1) - Math.max(a, t0)) / arco * 100);
    const c = colorePartito(t[1]);
    barre += '<i style="left:' + x.toFixed(2) + '%;width:' + l.toFixed(2) + '%;background:' + c +
      ';' + (chiaroSuScuro(c) ? 'color:#000;text-shadow:none' : '') + '" title="' +
      esc(nomePartito(t[1]) + ' — ' + dataIt(t[2]) + ' / ' + dataIt(t[3])) + '">' +
      (l > 7 ? esc(t[1]) : '') + '</i>';
  });
  let tacche = '';
  LEG.forEach(l => {
    const x = (giorno(l.da) - t0) / arco * 100;
    tacche += '<span style="left:' + x.toFixed(2) + '%">' + l.n + '</span>';
  });
  return '<div class="striscia">' + barre + '</div><div class="tacche">' + tacche + '</div>';
}

    return {p: p, n: mx, l: quale};

  const fedeli = con.filter(p => p.c === 0 && p.m.length === ORDINE.length);

       classifica(testa, p => p.c + (p.c === 1 ? ' cambio' : ' cambi'),
        p => passaggiDi(p).map(c => pill(c)).join(''));
  h += '<h2 style="margin-top:12px">Pi&ugrave; cambi dentro una sola legislatura</h2>' +
       '<table><tbody>' + senzaTagliare(dentroUna, 10, x => x.n).map(x =>
        '<tr class="riga" data-q="' + x.p.q + '"><td>' + esc(x.p.n) + '</td>' +
        '<td class="num">' + x.n + '</td><td>nella ' + x.l + '</td></tr>').join('') +
       '</tbody></table>';
  h += '<h2 style="margin-top:12px">Pi&ugrave; partiti diversi attraversati</h2>' +
       classifica(senzaTagliare(perGruppi, 10, p => partitiDi(p).length),
        p => partitiDi(p).length + ' partiti',
        p => partitiDi(p).map(c => pill(c)).join(''));

/* Una classifica non si taglia in mezzo a una fascia: se al quindicesimo
   posto ci sono cinque cambi, si mostrano tutti quelli con cinque cambi,
   altrimenti chi resta fuori ci resta per l'ordine alfabetico e non per
   quello che ha fatto. */
function senzaTagliare(elenco, quanti, quanto){
  if (elenco.length <= quanti) return elenco;
  const soglia = quanto(elenco[quanti - 1]);
  return elenco.filter(p => quanto(p) >= soglia);
}

function classifica(elenco, valore, extra){
  return '<table><tbody>' + elenco.map(p =>
    '<tr class="riga" data-q="' + p.q + '">' +
    '<td style="width:38%">' + esc(p.n) + '</td>' +
    '<td class="num" style="width:14%">' + valore(p) + '</td>' +
    '<td>' + (extra ? extra(p) : '') + '</td></tr>').join('') + '</tbody></table>';
}

/* I gruppi nati in corso di legislatura per sostenere un governo in difficolta'.
   La vista non dice perche' qualcuno ci sia entrato: dice chi, quando e da
   dove, che e' quello che c'e' scritto nei registri. */
const SOCCORSO = [
  {c: 'RESP', ramo: 'Camera', nato: '20110120'},
  {c: 'CN',   ramo: 'Senato', nato: '20110302'}
];

function daDoveVeniva(p, i){
  // L'ultimo gruppo vero prima del passaggio. Chi e' passato dal misto in
  // mezzo va riportato al gruppo da cui era uscito, non al misto. Ma chi nel
  // misto ci e' stato sempre viene dal misto, e va scritto: quei gruppi sono
  // nati nel 2011, nessuno ci e' stato eletto dentro.
  const g = p.g || [];
  if (i === 0) return {c: null, come: 'primo'};
  for (let k = i - 1; k >= 0; k--){
    if (g[k][1] !== 'MISTO' && g[k][1] !== g[i][1]) return {c: g[k][1], come: 'gruppo'};
  }
  return {c: 'MISTO', come: 'misto'};
}

/* ---------------------------------------------------------------------------
   Il ricontrollo dal vivo: interroga la Camera e Wikidata da questo browser e
   aggiorna quello che vede, tenendo il risultato in localStorage.

   Una regola sola, e non negoziabile: puo' soltanto AGGIUNGERE morti, mai
   toglierne. Una fonte che tace non e' una prova di niente, e un registro che
   non risponde farebbe resuscitare mezzo Parlamento. Per lo stesso motivo c'e'
   un tetto: se un giro solo volesse far morire piu' di trenta persone non e'
   una notizia, e' un guasto, e non si applica niente.

   Il Senato resta fuori: non manda le intestazioni CORS, quindi da una pagina
   web non e' raggiungibile. Il lavoro notturno invece lo interroga.
   --------------------------------------------------------------------------- */
const TETTO_MORTI = 30;

function morteSalvata(){
  try { return JSON.parse(localStorage.getItem('morti') || '{}'); }
  catch (e) { return {}; }
}

function applicaSalvate(){
  const m = morteSalvata();
  let n = 0;
  Object.keys(m).forEach(q => {
    const p = perQid[q];
    if (!p || p.s === 2) return;          // mai al contrario
    p.s = 2; p.d = m[q]; p.rc = 1; n++;
  });
  return n;
}

function chiediSparql(url, corpo, secondi){
  const taglia = new AbortController();
  const scadenza = setTimeout(() => taglia.abort(), (secondi || 60) * 1000);
  return fetch(url, {
    method: 'POST', signal: taglia.signal,
    headers: {'Accept': 'application/sparql-results+json',
              'Content-Type': 'application/x-www-form-urlencoded'},
    body: 'query=' + encodeURIComponent(corpo)
  }).then(r => {
    clearTimeout(scadenza);
    if (!r.ok) throw new Error('ha risposto ' + r.status);
    return r.json();
  }).then(d => d.results.bindings);
}

function dataCompatta(v){
  const t = String(v || '').replace(/[^0-9]/g, '');
  return t.length === 8 ? t.slice(0,4) + '-' + t.slice(4,6) + '-' + t.slice(6,8) : null;
}

async function ricontrolla(scrivi){
  const vivi = P.filter(p => p.s === 1);
  const nuove = {};
  scrivi('Persone che qui risultano vive: ' + vivi.length + '.');

  const perId = {};
  vivi.forEach(p => { if (p.ci) perId[p.ci] = p; });
  scrivi('Interrogo la Camera dei deputati...');
  try {
    const righe = await chiediSparql('https://dati.camera.it/sparql',
      'PREFIX foaf: <http://xmlns.com/foaf/0.1/> ' +
      'PREFIX bio: <http://purl.org/vocab/bio/0.1/> ' +
      'SELECT DISTINCT ?pers ?morte WHERE { ?pers a foaf:Person ; bio:Death ?d . ' +
      '?d bio:date ?morte }', 90);
    let visti = 0;
    righe.forEach(r => {
      const m = /\/p(\d+)/.exec(r.pers.value);
      if (!m) return;
      const p = perId[m[1]];
      if (!p) return;
      const data = dataCompatta(r.morte.value);
      if (data) { nuove[p.q] = data; visti++; }
    });
    scrivi('  risponde: ' + righe.length + ' decessi in archivio, ' + visti +
           ' riguardano chi qui risulta vivo.');
  } catch (e) {
    scrivi('  la Camera non risponde (' + e.message + '). Si prosegue senza.');
  }

  const qid = vivi.filter(p => p.q.charAt(0) === 'Q').map(p => p.q);
  scrivi('Interrogo Wikidata (' + qid.length + ' schede, a blocchi)...');
  for (let i = 0; i < qid.length; i += 400) {
    const blocco = qid.slice(i, i + 400);
    try {
      const righe = await chiediSparql('https://query.wikidata.org/sparql',
        'SELECT ?p ?morte WHERE { VALUES ?p { wd:' + blocco.join(' wd:') +
        ' } ?p wdt:P570 ?morte }', 60);
      righe.forEach(r => {
        const q = r.p.value.split('/').pop();
        const data = (r.morte.value || '').slice(0, 10);
        if (perQid[q] && data && !nuove[q]) nuove[q] = data;
      });
    } catch (e) {
      scrivi('  blocco ' + (i / 400 + 1) + ': ' + e.message);
    }
  }

  const quanti = Object.keys(nuove).length;
  if (!quanti) {
    scrivi('');
    scrivi('Nessuna novita. Sono ancora tutti al loro posto.');
    return;
  }
  if (quanti > TETTO_MORTI) {
    scrivi('');
    scrivi('FERMO TUTTO: il controllo vorrebbe far morire ' + quanti +
           ' persone in un colpo solo. Non e una notizia, e un guasto di una ' +
           'fonte. Non applico niente.');
    return;
  }
  const salvate = morteSalvata();
  Object.keys(nuove).forEach(q => { salvate[q] = nuove[q]; });
  try { localStorage.setItem('morti', JSON.stringify(salvate)); } catch (e) {}
  const n = applicaSalvate();
  scrivi('');
  scrivi(quanti + (quanti === 1 ? ' persona risulta deceduta' :
         ' persone risultano decedute') + ' secondo le fonti, e qui non lo era:');
  Object.keys(nuove).forEach(q => {
    scrivi('   ' + ((perQid[q] && perQid[q].n) || q) + ' - ' + dataIt(nuove[q]));
  });
  scrivi('');
  scrivi('Aggiornate ' + n + ' schede, e restano su questo computer. Il sito ' +
         'pubblicato si aggiorna per conto suo ogni notte.');
}

function barra(n, massimo, colore){
  const l = massimo ? Math.max(1, Math.round(100 * n / massimo)) : 0;
  return '<span style="display:inline-block;height:10px;vertical-align:0;width:' +
    l + '%;background:' + (colore || '#000080') + ';border:1px solid rgba(0,0,0,.4)"></span>';
}

function tabellaConBarre(righe, fnClic){
  const massimo = Math.max.apply(null, righe.map(r => r[1]).concat([1]));
  return '<table><tbody>' + righe.map(r =>
    '<tr><td style="width:22%;white-space:nowrap">' + r[0] + '</td>' +
    '<td class="num" style="width:14%">' +
      // r[4], se c'e', e' il numero gia' scritto come va letto: '12,0%'.
      (fnClic ? numero(r[4] || r[1], fnClic(r)[0], fnClic(r)[1]) : (r[4] || r[1])) + '</td>' +
    '<td>' + barra(r[1], massimo, r[2]) + '</td></tr>').join('') + '</tbody></table>';
}

/* ---------------------------------------------------------------------------
   Il cestino. Condanne passate in giudicato, verificate una per una sulle voci
   di Wikipedia: nome, reato, anno, grado, pena e link alla fonte.

   Wikidata ne dichiarava quattordici; nove sono state scartate perche' non
   definitive, non confermate o con dati sbagliati. Il patteggiamento e'
   equiparato per legge a una condanna e viene indicato come tale, perche' non
   e' la stessa cosa di una condanna in dibattimento e chi legge ha diritto di
   saperlo. Dove c'e' stata riabilitazione, sta scritto.
   --------------------------------------------------------------------------- */
VISTE['cestino'] = function(){
  const C = DATI.condanne;
  if (!C || !C.voci || !C.voci.length)
    throw new Error('Il cestino e vuoto: manca data/condanne.json.');

  const perPersona = {};
  C.voci.forEach(v => (perPersona[v.qid] = perPersona[v.qid] || []).push(v));
  const chi = Object.keys(perPersona)
    .filter(q => perQid[q])
    .sort((a, b) => perCognome(perQid[a], perQid[b]));

  let h = '<h1>Cestino</h1>' +
    '<p><b>' + chi.length + ' persone</b> su ' + P.length +
    ' hanno una condanna penale passata in giudicato, per un totale di ' +
    C.voci.length + ' sentenze.</p>' +
    '<p class="piede">Ogni riga e\' verificata sulla voce di Wikipedia in italiano, che e\' linkata sotto ciascuna. Il patteggiamento e\' equiparato per legge a una condanna ma non e\' una condanna in dibattimento, e viene distinto. Chi non compare non e\' per questo senza vicende giudiziarie.</p>';

  chi.forEach(q => {
    const p = perQid[q];
    h += '<div class="riquadro" style="margin-bottom:8px">' +
      '<div style="font-size:13px"><b><span class="clic" data-apri="persona" ' +
      'data-arg="' + q + '">' + esc(p.n) + '</span></b>' +
      (p.k && p.k.length ? ' <span style="color:#404040">&mdash; ' +
        esc(p.k.join('; ')) + '</span>' : '') + '</div>' +
      '<table style="margin-top:5px"><tbody>' +
      perPersona[q].map(v =>
        '<tr><td style="width:44%">' + esc(v.reato) + '</td>' +
        '<td style="width:16%">' + (v.anno || '<span style="color:#606060">' +
          'anno non indicato</span>') + '</td>' +
        '<td style="width:20%">' + (v.grado === 'patteggiamento'
          ? '<span class="pill" style="background:#8a7ca8">patteggiamento</span>'
          : '<span class="pill" style="background:#8b0000">definitiva</span>') +
        '</td><td>' + esc(v.pena || '') + '</td></tr>' +
        (v.dettaglio ? '<tr><td colspan="4" style="color:#404040;padding-bottom:4px">' +
          esc(v.dettaglio) + '</td></tr>' : '')).join('') +
      '</tbody></table>' +
      '<div class="piede" style="margin-top:4px;padding-top:4px">' +
      '<a target="_blank" rel="noopener" href="' + esc(perPersona[q][0].fonte) +
      '">Voce su Wikipedia</a></div></div>';
  });

  h += '<p class="piede">Verifica del 30 agosto 2026. Se qualcosa qui &egrave; ' +
    'sbagliato o superato, scrivete a davide.caniatti@gmail.com e viene ' +
    'corretto: <span class="clic" data-apri="errore">segnala un errore</span>.</p>';

  return {titolo: 'Cestino', icona: '&#128465;', html: h, faccia: true,
          larghezza: 660, altezza: 540,
          stato: chi.length + ' persone', stato2: C.voci.length + ' sentenze'};
};

function esegui(){
  const q = (document.getElementById('q-esegui').value || '').trim().toLowerCase();
  const avviso = document.getElementById('esito-esegui');
  avviso.textContent = '';
  if (!q){
    apri('persona', P[Math.floor(Math.random() * P.length)].q);
    return;
  }
  const part = Object.keys(PARTITI).find(c => c.toLowerCase() === q ||
    PARTITI[c].nome.toLowerCase() === q);
  if (part) return apri('partito', part);
  const esatto = P.find(p => p.n.toLowerCase() === q);
  if (esatto) return apri('persona', esatto.q);
  const simili = P.filter(p => p.n.toLowerCase().indexOf(q) >= 0);
  if (simili.length === 1) return apri('persona', simili[0].q);
  if (simili.length > 1) return apri('lista', 'cerca:' + q);
  avviso.textContent = 'Impossibile trovare "' + q +
    '". Controllare di aver digitato correttamente il nome.';
}

/* ---- La linea del tempo dei partiti ---- */
VISTE['tempo'] = function(){
  const t0 = giorno(LEG[0].da), t1 = giorno(LEG[LEG.length - 1].a);
  const arco = t1 - t0;
  const righe = Object.keys(PARTITI).map(c => {
    const a = annidiPartito(c);
    return {c: c, da: a[0], a: a[1], n: membriDi(c).length};
  }).filter(x => x.n && x.da && x.a).sort((x, y) => x.da.localeCompare(y.da) || y.n - x.n);

  let h = '<h1>Linea del tempo</h1>' +
    '<p>Ogni barra &egrave; un partito: comincia il primo giorno in cui qualcuno ' +
    'vi risulta iscritto e finisce l&rsquo;ultimo. L&rsquo;altezza dice quante ' +
    'persone ci sono passate.</p><div style="min-width:520px">';
  const massimo = Math.max.apply(null, righe.map(r => r.n));
  righe.forEach(r => {
    const x = Math.max(0, (giorno(r.da) - t0) / arco) * 100;
    const l = Math.max(0.7, (giorno(r.a) - giorno(r.da)) / arco * 100);
    const alto = 6 + Math.round(14 * r.n / massimo);
    const col = colorePartito(r.c);
    h += '<div style="position:relative;height:' + (alto + 6) + 'px;margin-bottom:2px">' +
      '<span class="clic" data-apri="partito" data-arg="' + r.c + '" ' +
      'title="' + esc(nomePartito(r.c)) + ' — ' + r.n + ' persone" ' +
      'style="position:absolute;left:' + x.toFixed(2) + '%;width:' + l.toFixed(2) +
      '%;height:' + alto + 'px;background:' + col +
      ';border:1px solid rgba(0,0,0,.45);text-decoration:none"></span>' +
      '<span style="position:absolute;left:calc(' + Math.min(x, 72).toFixed(2) +
      '% + ' + (l > 12 ? 3 : Math.round(l * 5) + 3) + 'px);font-size:10px;' +
      'line-height:' + (alto + 4) + 'px;color:#000;white-space:nowrap">' +
      esc(r.c) + '</span></div>';
  });
  h += '</div><div class="tacche" style="height:16px;margin-top:4px">' +
    LEG.map(l => '<span style="left:' +
      ((giorno(l.da) - t0) / arco * 100).toFixed(2) + '%">' + l.n + '</span>').join('') +
    '</div>';
  return {titolo: 'Linea del tempo', icona: '&#128198;', html: h, faccia: true,
          larghezza: 700, altezza: 560, stato: righe.length + ' partiti'};
};

   nominale: quello, per queste votazioni, nessuno dei due registri lo
   pubblica. E' pero' un fatto vicino e verificabile, con nomi e date, e
   spesso dice la stessa cosa: nel dicembre 1994 quaranta deputati lasciano
   la Lega, nel luglio 2010 quarantasei lasciano il PdL. */
function movimentiFra(leg, da, a){
  const i = ORDINE.indexOf(leg);
  const fuori = [];
  P.forEach(p => {
    const g = (p.g || []).filter(t => t[0] === i);
    for (let k = 1; k < g.length; k++){
      if (g[k][2] >= da && g[k][2] <= a && g[k][1] !== g[k-1][1])
        fuori.push({p: p, da: g[k][2], prima: g[k-1][1], dopo: g[k][1]});
    }
  });
  fuori.sort((x, y) => x.da.localeCompare(y.da) || perCognome(x.p, y.p));
  return fuori;
}

function tabellaMovimenti(righe){
  if (!righe.length) return '<p style="color:#606060">Nessun cambio di gruppo ' +
    'in quelle settimane.</p>';
  return '<table><thead><tr><th>Il giorno</th><th>Nome</th><th>Da</th>' +
    '<th>A</th></tr></thead><tbody>' + righe.map(r =>
    '<tr class="riga" data-q="' + r.p.q + '"><td>' + dataIt(r.da) + '</td>' +
    '<td>' + esc(perElenco(r.p)) + '</td>' +
    '<td>' + pill(r.prima, nomePartito(r.prima)) + '</td>' +
    '<td>' + pill(r.dopo, nomePartito(r.dopo)) + '</td></tr>').join('') +
    '</tbody></table>';
}

/* ---------------------------------------------------------------------------
   Il voto sul conflitto di attribuzione, con i nomi.

   Attenzione a come si racconta. Nessuno ha votato «che Ruby fosse la nipote

   Mubarak, e agisse quindi nell'esercizio delle sue funzioni. Nel dibattito
   pubblico e' rimasta quella frase, e qui c'e' scritto perche'.

   La Camera vota il 5 aprile 2011, il Senato il 14 settembre. Del voto della
   Camera negli open data non c'e' traccia, e comunque la Camera pubblica solo
   i totali. Del Senato c'e' l'appello nominale, ed e' quello che si legge qui.
   --------------------------------------------------------------------------- */
VISTE['mubarak'] = function(){
  const V = DATI.voto_ruby;
  if (!V || !V.voti || !V.voti.length)
    throw new Error('Il voto non e stato incorporato: manca data/voto_ruby.json.');

  const gruppi = {favorevole: [], contrario: [], astenuto: []};
  V.voti.forEach(v => {
    const p = perQid[v.qid];
    if (p) gruppi[v.come].push(p);
  });
  Object.keys(gruppi).forEach(k => gruppi[k].sort(perCognome));

  const partitoIl = (p, quando) => {
    let scelto = null;
    (p.g || []).forEach(t => {
      if (t[2] && t[2] <= quando && (!t[3] || t[3] >= quando)) scelto = t[1];
    });
    return scelto;
  };
  const GIORNO = '20110914';

  let h = '<h1>La nipote di Mubarak</h1>' +
    '<p>Il 5 aprile 2011 la Camera, e il <b>14 settembre 2011</b> il Senato, ' +
    'votano per sollevare davanti alla Corte costituzionale un <b>conflitto di ' +
    'attribuzione</b>: la tesi era che i magistrati di Milano, indagando sul ' +
    'caso Ruby, avessero invaso la sfera del potere di governo. La premessa ' +
    'della Giunta per le autorizzazioni era che Silvio Berlusconi, telefonando ' +
    'in questura, ritenesse la ragazza <b>nipote di Hosni Mubarak</b>, e ' +
    'agisse dunque nell&rsquo;esercizio delle sue funzioni.</p>' +
    '<p>Nessuno ha votato che Ruby fosse davvero la nipote di Mubarak: si ' +
    'votava il conflitto. Ma la premessa era quella, ed &egrave; la frase ' +
    'con cui quel voto &egrave; passato alla storia.</p>';

  h += '<div class="gruppone">' +
    '<div class="riquadro"><div>A favore del conflitto</div>' +
      '<div class="grande" style="color:#006400">' + V.favorevoli + '</div>' +
      '<div style="font-size:11px;color:#404040">Il conflitto fu sollevato.</div></div>' +
    '<div class="riquadro"><div>Contrari</div>' +
      '<div class="grande" style="color:#8b0000">' + V.contrari + '</div>' +
      '<div style="font-size:11px;color:#404040">Su ' + V.votanti + ' votanti.</div></div>' +
    '<div class="riquadro"><div>Astenuti</div>' +
      '<div class="grande">' + V.astenuti + '</div>' +
      '<div style="font-size:11px;color:#404040">' + V.presenti + ' presenti.</div></div>' +
    '</div>';

  const blocco = (chiave, titolo, colore) => {
    const g = gruppi[chiave];
    if (!g.length) return '';
    return '<h2 style="margin-top:14px">' + titolo + ' (' + g.length + ')</h2>' +
      '<table><tbody>' + g.map(p => {
        const c = partitoIl(p, GIORNO);
        return '<tr class="riga" data-q="' + p.q + '">' +
          '<td style="width:46%"><span style="color:' + colore + '">&#9632;</span> ' +
          esc(perElenco(p)) + '</td>' +
          '<td>' + (c ? pill(c, nomePartito(c)) : '') + '</td></tr>';
      }).join('') + '</tbody></table>';
  };

  h += blocco('favorevole', 'Hanno votato a favore', '#006400') +
       blocco('contrario', 'Hanno votato contro', '#8b0000') +
       blocco('astenuto', 'Si sono astenuti', '#808080');

  h += '<p class="piede">Appello nominale del Senato della Repubblica, seduta ' +
    'del 14 settembre 2011, votazione elettronica: ' + esc(V.esito) + '. ' +
    'Il gruppo indicato accanto a ogni nome &egrave; quello a cui la persona ' +
    'risultava iscritta quel giorno. Fonte: ' +
    '<a target="_blank" rel="noopener" href="' + esc(V.fonte) + '">dati.senato.it</a>.</p>' +
    '<p class="piede">Della votazione della Camera del 5 aprile 2011 non ' +
    'esiste l&rsquo;equivalente: gli open data della Camera coprono le ' +
    'votazioni legate agli atti legislativi, e in ogni caso pubblicano solo i ' +
    'totali, mai i nomi. Per i deputati questa tabella non si pu&ograve; fare.</p>';

  return {titolo: 'La nipote di Mubarak', icona: '&#127466;&#127468;', html: h,
          faccia: true, larghezza: 660, altezza: 560,
          stato: V.favorevoli + ' a ' + V.contrari,
          stato2: '14 settembre 2011'};

/* ---------------------------------------------------------------------------

   distinte perche' hanno un peso diverso: la circoscrizione Estero viene dai
   registri come tutto il resto del sito, la cronologia no. Quella e' una
   scelta di chi scrive, ogni voce con la sua data e la sua fonte, e sta
   scritto che lo e'.
   --------------------------------------------------------------------------- */
const CIRCOSCRIZIONI = [
  ['EUROPA', 'Europa'],
  ['AMERICA MERIDIONALE', 'America meridionale'],
  ['AMERICA SETTENTRIONALE', 'America settentrionale e centrale'],
  ['AFRICA', 'Africa, Asia, Oceania e Antartide'],
  ['ASIA', 'Africa, Asia, Oceania e Antartide']
];

function circoscrizioneDi(testo){
  const t = (testo || '').toUpperCase();
  for (let i = 0; i < CIRCOSCRIZIONI.length; i++)
    if (t.indexOf(CIRCOSCRIZIONI[i][0]) >= 0) return CIRCOSCRIZIONI[i][1];
  return null;
}

      (per[c] = per[c] || {})[m] = (per[c][m] || 0) + 1;
    });

  let h = '<h1>Fuori dall&rsquo;Italia</h1>';

/* ---------------------------------------------------------------------------
   Le poltrone: chi ne ha occupate di piu'. Una poltrona qui e' un seggio in
   una legislatura o un posto in un governo, e si sommano: sono le due cose
   che i registri contano davvero.

   governo di Berlusconi sia in uno di Prodi, D'Alema o Amato. Non e' un
   giudizio, e' un'intersezione fra due elenchi.

const DESTRA = ['Berlusconi I', 'Berlusconi II', 'Berlusconi III', 'Berlusconi IV'];
const SINISTRA = ['Prodi I', 'Prodi II', "D'Alema I", "D'Alema II", 'Amato II'];

const poltrone = p => p.m.length + (p.gv || []).length;

VISTE['poltrone'] = function(){

  const tutte = P.slice().sort((a, b) => poltrone(b) - poltrone(a) || perCognome(a, b));
  const testa = senzaTagliare(tutte, 15, poltrone);
  h += '<h2>Il totale</h2>' +

      '<td style="font-size:11px">' + esc((p.k || []).join('; ')) + '</td></tr>'
    ).join('') + '</tbody></table>';

  const perGoverni = conGoverni.slice().sort(
    (a, b) => b.gv.length - a.gv.length || perCognome(a, b));
  const capiG = senzaTagliare(perGoverni, 10, p => p.gv.length);
  h += '<h2 style="margin-top:14px">Pi&ugrave; governi attraversati</h2>' +
    '<table><tbody>' + capiG.map(p =>
      '<tr class="riga" data-q="' + p.q + '"><td style="width:26%">' +
      esc(perElenco(p)) + '</td><td class="num" style="width:8%">' +
      p.gv.length + '</td><td style="font-size:11px">' +
      esc(p.gv.join(', ')) + '</td></tr>').join('') + '</tbody></table>';

  const conCariche = P.filter(p => (p.k || []).length);
  const perCariche = conCariche.slice().sort(
    (a, b) => b.k.length - a.k.length || perCognome(a, b));
  const capiC = senzaTagliare(perCariche, 10, p => p.k.length);
  h += '<h2 style="margin-top:14px">Pi&ugrave; incarichi diversi</h2>' +
    '<table><tbody>' + capiC.map(p =>
      '<tr class="riga" data-q="' + p.q + '"><td style="width:26%">' +
      esc(perElenco(p)) + '</td><td class="num" style="width:8%">' +
      p.k.length + '</td><td style="font-size:11px">' +
      esc(p.k.join('; ')) + '</td></tr>').join('') + '</tbody></table>';


  const conIncarichi = P.filter(p => p['in']);
  const quanti = p => {
    let n = 0;
    Object.keys(p['in'] || {}).forEach(m => { n += p['in'][m].length; });
    return n;
  };
  const perIncarichi = conIncarichi.slice().sort(
    (a, b) => quanti(b) - quanti(a) || perCognome(a, b));
  const capiI = senzaTagliare(perIncarichi, 12, quanti);
  h += '<h2 style="margin-top:14px">Pi&ugrave; incarichi parlamentari</h2>' +
    '<p>Presidenze e vicepresidenze di commissione, ufficio di presidenza, ' +
    'questori, segretari, capigruppo in commissione: <b>' + conIncarichi.length +
    '</b> persone ne hanno avuto almeno uno.</p>' +

    'gli incarichi interni dei suoi senatori, quindi questa met&agrave; del ' +
    'Parlamento resta scoperta.</p>';

  const traversi = conGoverni.filter(p =>
    p.gv.some(g => DESTRA.indexOf(g) >= 0) &&

    '<p>Hanno avuto un posto sia in un governo di Berlusconi sia in uno di ' +

    (traversi.length

          esc(perElenco(p)) + '</td><td style="font-size:11px">' +
          esc(p.gv.join(', ')) + '</td></tr>').join('') + '</tbody></table>'

        '<td class="num">' + String(e.affluenza).replace('.', ',') + '%</td>' +
        '<td style="font-size:11px">' + esc(e.legge) + '</td>' +
        '<td>' + (e.dopo

          : '<span style="color:#606060">&mdash;</span>') + '</td></tr>';
    }).join('') + '</tbody></table>';

  const massimaA = Math.max.apply(null, E.politiche.map(x => x.affluenza));
  h += '<h3 style="margin-top:10px">L&rsquo;affluenza, elezione per elezione</h3>' +
    tabellaConBarre(E.politiche.map(e =>
      [e.data.slice(0, 4), e.affluenza, '#000080', null,
       String(e.affluenza).replace('.', ',') + '%']));
  h += '<p style="color:#404040;font-size:11px">Dall&rsquo;86,07% del 1994 al ' +
    '75,19% del 2013: quasi undici punti in diciannove anni.</p>';

    abrogativi.length + ' abrogativi e ' + (R.length - abrogativi.length) +

    'raggiunto il quorum. Nei costituzionali il quorum non esiste.</p>' +
    '<table><thead><tr><th>Quando</th><th>Tipo</th><th>Oggetto</th>' +
    '<th class="num">Affluenza</th><th>Esito</th></tr></thead><tbody>' +
    R.map(r => {
      const colore = r.quorum === true ? '#006400'
                   : (r.quorum === false ? '#8b0000' : '#000080');
      return '<tr><td style="white-space:nowrap"><a target="_blank" ' +
        'rel="noopener" href="' + esc(r.fonte) + '">' + esc(r.etichetta) + '</a></td>' +

/* ---------- salvaschermo e schermata blu ---------- */
let inattivo = 0, timerSalva = null;
function contaInattivita(){
  inattivo = 0;
  const s = document.getElementById('salvaschermo');
  if (s.classList.contains('acceso')){
    s.classList.remove('acceso');
    clearInterval(timerSalva); timerSalva = null;
  }
}
setInterval(() => {
  inattivo++;
  if (inattivo === 300) accendiSalvaschermo();      // cinque minuti
}, 1000);

function accendiSalvaschermo(){
  const s = document.getElementById('salvaschermo');
  const b = s.querySelector('b');
  s.classList.add('acceso');
  let x = 60, y = 60, dx = 2.2, dy = 1.7;
  timerSalva = setInterval(() => {
    const L = window.innerWidth - b.offsetWidth, A = window.innerHeight - b.offsetHeight;
    x += dx; y += dy;
    if (x < 0 || x > L) { dx = -dx; x = Math.max(0, Math.min(L, x)); }
    if (y < 0 || y > A) { dy = -dy; y = Math.max(0, Math.min(A, y)); }
    b.style.left = x + 'px'; b.style.top = y + 'px';
  }, 30);
}

function schermataBlu(messaggio){
  const b = document.getElementById('bsod');
  document.getElementById('bsod-testo').innerHTML =
    'Si &egrave; verificato un errore irreversibile alla 0E:0028:C11B3ADC ' +
    'nell&rsquo;applicazione corrente.<br><br>' + esc(messaggio) +
    '<br><br>L&rsquo;applicazione verr&agrave; chiusa.';
  b.classList.add('acceso');
  document.body.classList.remove('attesa');
}
window.onerror = function(m){ schermataBlu(m); return true; };

/* ---------- ascolti ---------- */
document.addEventListener('mousemove', contaInattivita);
document.addEventListener('keydown', contaInattivita);
document.addEventListener('click', contaInattivita, true);

document.addEventListener('click', e => {
  if (document.getElementById('bsod').classList.contains('acceso')){
    document.getElementById('bsod').classList.remove('acceso');
    return;
  }
  const av = document.getElementById('avvio');
  const menu = document.getElementById('menu');
  if (e.target.closest('#avvio')){
    menu.classList.toggle('aperto');
    av.classList.toggle('aperto', menu.classList.contains('aperto'));
    return;
  }
  // Qualunque clic che non sia sul pulsante Avvio chiude il menu, compresi
  // quelli sulle sue voci: altrimenti resta aperto sopra la finestra che ha
  // appena aperto, e la copre.
  menu.classList.remove('aperto');
  av.classList.remove('aperto');

  if (e.target.closest('#chiudi-sessione')){
    return schermataBlu('Chiusura della sessione in corso. In realtà non si ' +
      'chiude niente: è una pagina web.');
  }
  const bersaglio = e.target.closest('[data-apri]');
  if (bersaglio){
    apri(bersaglio.dataset.apri, bersaglio.dataset.arg || '');
    return;
  }
  const riga = e.target.closest('tr.riga');
  if (riga && riga.dataset.q) apri('persona', riga.dataset.q);
});

document.addEventListener('keydown', e => {
  // La combinazione che si premeva quando un programma non rispondeva piu'.
  if (e.ctrlKey && e.altKey && (e.key === 'Delete' || e.key === 'Backspace')){
    e.preventDefault();
    apri('spread');
    return;
  }
  if (e.key === 'Escape'){
    document.getElementById('bsod').classList.remove('acceso');
    document.getElementById('menu').classList.remove('aperto');
  }
});

document.addEventListener('input', e => {
  if (e.target.id === 'q-elenco'){
    const q = e.target.value.trim().toLowerCase();
    const gente = q ? P.filter(p => p.n.toLowerCase().indexOf(q) >= 0) : P;
    document.getElementById('corpo-elenco').innerHTML = tabellaPersone(gente);
    document.getElementById('n-elenco').textContent =
      gente.length + (gente.length === 1 ? ' persona' : ' persone');
  }
});

function cercaOra(){
  const q = (document.getElementById('q-trova').value || '').trim();
  if (!q) return;
  const b = q.toLowerCase();
  const gente = P.filter(p => p.n.toLowerCase().indexOf(b) >= 0);
  const parti = Object.keys(PARTITI).filter(c =>
    c.toLowerCase().indexOf(b) >= 0 || PARTITI[c].nome.toLowerCase().indexOf(b) >= 0);
  let h = '';
  if (parti.length) h += '<h2>Partiti</h2><p>' + parti.map(c =>
    '<span class="clic" data-apri="partito" data-arg="' + c + '">' +
    pill(c, nomePartito(c)) + '</span>').join(' ') + '</p>';
  h += '<h2>Persone (' + gente.length + ')</h2>' +
       tabellaPersone(gente.slice().sort(perCognome));
  document.getElementById('esito-trova').innerHTML = h;
}
document.addEventListener('click', e => {
  if (e.target.id === 'vai-trova') cercaOra();
  if (e.target.id === 'vai-aggiorna'){
    const b = e.target, esito = document.getElementById('esito-aggiorna');
    b.disabled = true;
    b.textContent = 'Controllo in corso...';
    document.body.classList.add('attesa');
    esito.textContent = '';
    const scrivi = t => { esito.textContent += t + '\n'; };
    ricontrolla(scrivi).catch(err => scrivi('Errore: ' + err.message)).then(() => {
      b.disabled = false;
      b.textContent = 'Controlla di nuovo';
      document.body.classList.remove('attesa');
      // I conteggi della prima pagina sono cambiati: la si rifa'.
      Object.keys(FIN).forEach(k => { if (FIN[k].vista === 'indice') chiudi(k); });
    });
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'q-trova') cercaOra();
  if (e.key === 'Enter' && e.target.id === 'q-esegui') esegui();
});

document.addEventListener('change', e => {
  if (e.target.id === 'conf-a' || e.target.id === 'conf-b') disegnaConfronto();
});

/* ---------- avvio ---------- */
applicaSalvate();
disegnaScrivania();
orologio();
setInterval(orologio, 20000);

const partenza = decodeURIComponent(location.hash.replace(/^#/, ''));
if (partenza){
  const i = partenza.indexOf('/');
  apri(i < 0 ? partenza : partenza.slice(0, i), i < 0 ? '' : partenza.slice(i+1), true);
} else {
  apri('indice', '', true);
}
</script>
</body>
</html>
